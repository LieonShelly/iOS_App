<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Close The Door - Home</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Close The Door</h1>
            <p class="subtitle">减少强迫性确认行为</p>
        </header>
        
        <main>
            <div class="confirm-section">
                <button id="confirm-button" class="confirm-button">确认</button>
                <p class="confirm-count">今日确认: <span id="confirm-count">0</span> 次</p>
                <div id="countdown-container" class="countdown-container hidden">
                    <p>请等待 <span id="countdown">5</span> 分钟</p>
                </div>
            </div>
            
            <div class="stats-section">
                <button id="stats-button" class="stats-button">查看数据趋势</button>
            </div>
        </main>
        
        <footer>
            <p>© 2023 Close The Door</p>
        </footer>
    </div>
    
    <script src="js/script.js"></script>
</body>
</html>
